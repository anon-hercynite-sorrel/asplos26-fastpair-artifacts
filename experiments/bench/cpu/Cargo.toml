[package]
name = "onpair-cpu-bench"
version = "0.1.0"
edition = "2021"
description = "OnPair CPU decode microbenchmark: fat dictionary vs original variable-stride, across threads."

[[bin]]
name = "onpair-cpu-bench"
path = "main.rs"

[dependencies]
onpair = "0.0.4"
# CPU-SOTA competitors (decode-throughput x ratio on the same columns):
fsst-rs = "0.5"          # FSST, the string-codec lineage OnPair descends from
zstd = "0.13"            # software Zstd (levels -10/1/3, mirroring the GPU)
lz4_flex = "0.11"        # LZ4 (parallels the DE's LZ4 mode), pure-Rust (aarch64-portable)
flate2 = "1"             # Deflate hi/fast (parallels the DE's two DEFLATE modes), miniz_oxide backend

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
